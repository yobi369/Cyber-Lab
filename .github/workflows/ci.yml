name: CI
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install security test dependency
        run: python -m pip install -r requirements-security.txt
      - name: Compile
        run: python -m compileall -q admin_lab.py audit_chain.py audit_checkpoint.py security_controls.py oidc.py identity.py storage.py training_platform.py dashboard.py manage_users.py migrate_database.py tests
      - name: Unit and security tests
        run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement requirements-browser-test.txt --requirement requirements-security.txt
          python -m playwright install --with-deps chromium
      - name: Chromium authentication and CSRF tests
        run: python -m unittest discover -s browser_tests -v
