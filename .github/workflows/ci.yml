name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q admin_lab.py audit_chain.py training_platform.py dashboard.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
